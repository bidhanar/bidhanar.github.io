  <style>
    /* Center the whole contact section */
    .contact-grid {
      display: grid;
      justify-content: center;
      justify-items: center;
      gap: 1rem;
      margin-top: 2rem;
      max-width: 600px;
      margin-inline: auto;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 0.9rem 1.1rem;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      width: 100%;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .contact-item:hover {
      background: rgba(255,255,255,0.06);
      transform: translateY(-3px);
    }

    .contact-item svg {
      width: 22px;
      height: 22px;
      stroke: var(--accent);
      flex-shrink: 0;
    }

    .contact-item a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .contact-item a:hover {
      color: var(--accent-2);
      text-decoration: underline;
    }

    /* Center the heading and text */
    h1, .muted {
      text-align: center;
    }

    /* Slightly fade the intro text */
    .muted {
      margin-bottom: 1rem;
      color: var(--muted);
    }
  </style>
</head>
