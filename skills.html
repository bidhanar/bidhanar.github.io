<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Skills — Bidhan Arya</title>
  <meta name="description" content="Technical skills, tools and proficiencies for Bidhan Arya." />
  <link rel="stylesheet" href="styles-index.css">
  <!-- Chart.js for radar chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Skill-page specific styles (can be moved to styles-index.css later) */
    .skills-hero { display:flex; gap:1.25rem; align-items:flex-start; flex-wrap:wrap; margin-top:0.5rem; }
    .skill-left { width: 360px; min-width:280px; /* sticky so it doesn't cause page jump */ position: sticky; top: 84px; align-self:start; max-height: calc(100vh - 140px); overflow:auto; padding:1rem; }
    .skill-right { flex:1 1 420px; min-width:280px; }

    .chips { display:flex; gap:0.6rem; flex-wrap:wrap; margin:0.75rem 0 1rem; }
    .chip {
      padding:0.45rem 0.75rem;
      border-radius:999px;
      background:rgba(255,255,255,0.03);
      color:var(--muted);
      border:1px solid rgba(255,255,255,0.02);
      cursor:pointer;
      font-weight:600;
    }
    .chip[aria-pressed="true"]{
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color:#021012;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      transform: translateY(-2px);
    }

    .skill-group { margin-top:1rem; display:grid; gap:0.9rem; }
    .skill-row { display:flex; gap:1rem; align-items:center; justify-content:space-between; padding:0.6rem; background:rgba(255,255,255,0.02); border-radius:10px; }
    .skill-meta { display:flex; gap:0.9rem; align-items:center; }
    .skill-icon { width:36px; height:36px; border-radius:8px; display:inline-grid; place-items:center; background:rgba(255,255,255,0.02); color:var(--accent); font-weight:700; }
    .skill-name { font-weight:600; color:var(--text); }
    .skill-sub { font-size:0.86rem; color:var(--muted); }

    .progress-shell { width:220px; height:12px; background: rgba(255,255,255,0.04); border-radius:999px; overflow:hidden; }
    .progress-fill { height:100%; width:0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:999px; transition: width 900ms cubic-bezier(.2,.9,.3,1); }

    /* ensure canvas responsive, contained and doesn't expand page */
    #skillsRadar { width:100% !important; height: auto !important; display:block; }

    @media (max-width:940px){
      .skills-hero { flex-direction:column; }
      .skill-left, .skill-right { width:100%; min-width:0; position:static; max-height:none; overflow:visible; }
      #skillsRadar { height:320px !important; }
    }

    .legend { display:flex; gap:0.75rem; margin-top:0.5rem; color:var(--muted); font-size:0.9rem; flex-wrap:wrap; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="index.html">Bidhan Arya</a>
      <nav class="main-nav" aria-label="Main navigation">
        <a class="btn ghost small" href="index.html">Home</a>
        <a class="btn ghost small" href="projects.html">Projects</a>
        <a class="btn ghost small" href="skills.html" aria-current="page">Skills</a>
        <a class="btn ghost small" href="stories.html">Stories</a>
        <a class="btn ghost small" href="poems.html">Poems</a>
        <a class="btn ghost small" href="about.html">About</a>
        <a class="btn ghost small" href="resume.pdf">Resume</a>
        <a class="btn ghost small" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section card">
      <h1>Skills</h1>
      <p class="muted">Organized by category. Click a chip to filter. Percentages are self-assessed and editable below.</p>

      <div class="chips" role="tablist" aria-label="Skill filters">
        <button class="chip" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="programming" aria-pressed="false">Programming</button>
        <button class="chip" data-filter="libraries" aria-pressed="false">Libraries &amp; Tools</button>
        <button class="chip" data-filter="flight" aria-pressed="false">Flight / Sim</button>
        <button class="chip" data-filter="other" aria-pressed="false">Other</button>
      </div>

      <div class="skills-hero">
        <div class="skill-left card">
          <h3 style="margin:0 0 0.6rem;">Summary</h3>
          <canvas id="skillsRadar" aria-label="Skills radar chart"></canvas>
          <div class="legend">
            <span class="muted">Radar shows category averages</span>
          </div>
        </div>

        <div class="skill-right">
          <!-- Skill groups inserted by JS -->
          <div id="skill-list" class="skill-group"></div>
        </div>
      </div>

      <p style="margin-top:1rem"><a class="btn outline" href="resume.pdf" target="_blank">View Resume</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><small>© <span id="yrSkills"></span> Bidhan</small></div>
  </footer>

  <script>
    document.getElementById('yrSkills').textContent = new Date().getFullYear();

    /* ---------------------------
       Skills data (edit here)
       - category: programming | libraries | flight | other
       - name, level: 0-100, sub (optional), icon (text or short)
       Notes:
         * Japanese: 15% (you specified)
         * Chess is shown with rating link in the subtext (1100)
       --------------------------- */
    const skillsData = [
      // Programming languages (adjusted)
      {category:'programming', name:'Python', level:90, sub:'Data & scripting', icon:'Py'},
      {category:'programming', name:'C', level:75, sub:'Embedded & low-level', icon:'C'},
      {category:'programming', name:'C++', level:70, sub:'Algorithms & OOP', icon:'C++'},
      {category:'programming', name:'Java', level:74, sub:'Android', icon:'J'},
      {category:'programming', name:'JavaScript', level:60, sub:'Frontend basics', icon:'JS'},
      {category:'programming', name:'Bash', level:72, sub:'Scripting & automation', icon:'$'},
      {category:'programming', name:'MATLAB', level:66, sub:'Numerics', icon:'M'},
      {category:'programming', name:'Fortran', level:40, sub:'legacy code', icon:'F'},
      {category:'programming', name:'MySQL', level:62, sub:'DB basics', icon:'DB'},

      // Libraries & platform skills
      {category:'libraries', name:'NumPy', level:88, sub:'arrays & numerics', icon:'N'},
      {category:'libraries', name:'Pandas', level:85, sub:'dataframes', icon:'Pd'},
      {category:'libraries', name:'Scikit-learn', level:72, sub:'ML basics', icon:'SK'},
      {category:'libraries', name:'Seaborn', level:72, sub:'visualization', icon:'Sv'},
      {category:'libraries', name:'TensorFlow', level:70, sub:'deep learning', icon:'TF'},
      {category:'libraries', name:'HTML / CSS', level:76, sub:'web basics', icon:'<>'},
      {category:'libraries', name:'Linux', level:84, sub:'shell & servers', icon:'~'},
      {category:'libraries', name:'Git / GitHub', level:90, sub:'version control', icon:'GH'},
      {category:'libraries', name:'LaTeX', level:82, sub:'papers & CV', icon:'La'},

      // Flight / simulation / embedded (you mentioned these)
      {category:'flight', name:'PX4', level:86, sub:'autopilot frameworks', icon:'PX4'},
      {category:'flight', name:'Gazebo', level:84, sub:'simulations', icon:'Gz'},
      {category:'flight', name:'ROS', level:66, sub:'robot middleware', icon:'ROS'},
      {category:'flight', name:'Flight Dynamics', level:72, sub:'trim, stability', icon:'FD'},
      {category:'flight', name:'SolidWorks', level:60, sub:'CAD & modelling', icon:'SW'},

      // Other tools / skills
      {category:'other', name:'Android Studio', level:74, sub:'mobile dev', icon:'AS'},
      {category:'other', name:'VS Code', level:88, sub:'IDE', icon:'VS'},
      {category:'other', name:'LabVIEW', level:48, sub:'instrumentation', icon:'LV'},
      {category:'other', name:'OpenVSP', level:52, sub:'geometry & design', icon:'VSP'},
      {category:'other', name:'Obsidian', level:64, sub:'notes', icon:'Ob'},
      {category:'other', name:'Japanese', level:15, sub:'learning (15%)', icon:'JP'},
      {category:'other', name:'Chess', level:28, sub:'1100 @ chess.com', icon:'♟'}
    ];

    /* --------- Render skill list grouped by category --------- */
    const skillList = document.getElementById('skill-list');

    function buildSkillRow(skill){
      const row = document.createElement('div');
      row.className = 'skill-row';
      row.dataset.category = skill.category;

      const meta = document.createElement('div');
      meta.className = 'skill-meta';
      const icon = document.createElement('div');
      icon.className = 'skill-icon';
      icon.textContent = skill.icon;
      const nm = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'skill-name';
      title.textContent = skill.name;
      const sub = document.createElement('div');
      sub.className = 'skill-sub';
      // Special case: Chess shows clickable link for your chess.com profile and rating
      if (skill.name === 'Chess' && skill.sub) {
        // show rating and link
        sub.innerHTML = `<a href="https://www.chess.com/member/trona_1729" target="_blank" rel="noopener" style="color:var(--muted); text-decoration:underline;">${skill.sub}</a>`;
      } else {
        sub.textContent = skill.sub || '';
      }
      nm.appendChild(title);
      nm.appendChild(sub);
      meta.appendChild(icon);
      meta.appendChild(nm);

      const progressWrap = document.createElement('div');
      progressWrap.style.display='flex';
      progressWrap.style.gap='0.6rem';
      progressWrap.style.alignItems='center';

      const shell = document.createElement('div');
      shell.className='progress-shell';
      const fill = document.createElement('div');
      fill.className='progress-fill';
      fill.style.width = '0%';
      shell.appendChild(fill);

      const percent = document.createElement('div');
      percent.style.minWidth='36px';
      percent.style.textAlign='right';
      percent.style.color='var(--muted)';
      percent.style.fontWeight='700';
      percent.textContent = skill.level + '%';

      progressWrap.appendChild(shell);
      progressWrap.appendChild(percent);

      row.appendChild(meta);
      row.appendChild(progressWrap);

      row._fill = fill;
      return row;
    }

    const categoriesOrder = ['programming','libraries','flight','other'];
    const categoryLabels = {
      programming: 'Programming',
      libraries: 'Libraries & Tools',
      flight: 'Flight / Simulation',
      other: 'Other Skills'
    };

    function renderAll(){
      skillList.innerHTML = '';
      categoriesOrder.forEach(cat => {
        const groupSkills = skillsData.filter(s => s.category === cat);
        if (groupSkills.length === 0) return;
        const heading = document.createElement('h3');
        heading.textContent = categoryLabels[cat];
        heading.style.marginTop = '0.6rem';
        heading.style.marginBottom = '0.4rem';
        heading.className = 'muted';
        skillList.appendChild(heading);

        const container = document.createElement('div');
        container.className = 'skill-group';

        groupSkills.forEach(s => {
          const row = buildSkillRow(s);
          container.appendChild(row);
        });

        skillList.appendChild(container);
      });
    }

    renderAll();

    /* --------- filtering logic for chips --------- */
    const chips = document.querySelectorAll('.chip');
    chips.forEach(ch => {
      ch.addEventListener('click', () => {
        const filter = ch.dataset.filter;
        chips.forEach(c => c.setAttribute('aria-pressed','false'));
        ch.setAttribute('aria-pressed','true');
        applyFilter(filter);
      });
      ch.addEventListener('keydown', (e)=> {
        if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ch.click(); }
      });
    });

    function applyFilter(filter){
      const rows = document.querySelectorAll('.skill-row');
      if(filter === 'all'){
        rows.forEach(r => r.style.display = 'flex');
      } else {
        rows.forEach(r => {
          r.style.display = (r.dataset.category === filter) ? 'flex' : 'none';
        });
      }
      animateVisible();
    }

    /* --------- animate progress bars --------- */
    function animateVisible(){
      const rows = document.querySelectorAll('.skill-row');
      rows.forEach((r, idx) => {
        const visible = r.style.display !== 'none';
        const name = r.querySelector('.skill-name').textContent;
        const skill = skillsData.find(s => s.name === name);
        const level = (skill && visible) ? skill.level : 0;
        const delay = 60 + (idx * 25); // stagger
        setTimeout(()=> r._fill.style.width = level + '%', delay);
      });
    }

    setTimeout(animateVisible, 220);

    /* --------- radar chart show category averages --------- */
    function categoryAverages(){
      const cats = {};
      skillsData.forEach(s=>{
        if(!cats[s.category]){ cats[s.category] = {sum:0, n:0}; }
        cats[s.category].sum += s.level; cats[s.category].n += 1;
      });
      return categoriesOrder.map(c => {
        if(!cats[c]) return 0;
        return Math.round(cats[c].sum / cats[c].n);
      });
    }

    const ctx = document.getElementById('skillsRadar').getContext('2d');
    const radar = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: categoriesOrder.map(c => categoryLabels[c]),
        datasets: [{
          label: 'Category proficiency',
          data: categoryAverages(),
          fill: true,
          backgroundColor: 'rgba(93,193,255,0.12)',
          borderColor: 'rgba(93,193,255,0.95)',
          pointBackgroundColor: 'rgba(93,193,255,0.95)',
          pointRadius: 4,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            suggestedMin: 0,
            suggestedMax: 100,
            ticks: { stepSize: 20, color: 'rgba(255,255,255,0.6)' },
            pointLabels: { color: 'rgba(255,255,255,0.8)' },
            grid: { color: 'rgba(255,255,255,0.04)' },
            angleLines: { color: 'rgba(255,255,255,0.06)' }
          }
        },
        plugins: { legend: { display: false } },
        elements: { line: { tension: 0.3 } }
      }
    });

    window.addEventListener('resize', ()=> radar.resize());
  </script>
</body>
</html>
